name: CI Dev build

# One build slot spans both credential-free packages. Full regression results
# belong to a separate workflow and do not admit or block a Dev candidate.
on:
  workflow_call:
    outputs:
      unsigned_release:
        value: ${{ jobs.bundle.outputs.release }}

permissions:
  contents: read

cache-mode: read

jobs:
  checks:
    name: Arch Dev package
    if: >-
      !cancelled() && github.repository == 'ufna/zerus' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.repository.private == false && vars.DEV_UPDATES_ENABLED == 'true'
    cache-mode: write
    uses: ./.github/workflows/dev-arch.yml
    with:
      save_caches: true
  bundle:
    name: Unsigned macOS Dev bundle
    if: >-
      !cancelled() && github.repository == 'ufna/zerus' && github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      github.event.repository.private == false && vars.DEV_UPDATES_ENABLED == 'true' && vars.MACOS_CASKS_ENABLED == 'true'
    uses: ./.github/workflows/macos-bundle.yml
    with:
      channel: dev
      run_tests: false
  gate:
    name: Dev package results
    needs: [checks, bundle]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: none
    env:
      CHECKS: ${{ needs.checks.result }}
      BUNDLE: ${{ needs.bundle.result }}
      MACOS: ${{ vars.MACOS_CASKS_ENABLED }}
    steps:
      - run: |
          python3 - <<'PY'
          import os
          expected_bundle = 'success' if os.environ['MACOS'] == 'true' else 'skipped'
          if os.environ['CHECKS'] != 'success' or os.environ['BUNDLE'] != expected_bundle:
              raise SystemExit('Dev requires its successful Arch package and selected unsigned Mac bundle.')
          PY
