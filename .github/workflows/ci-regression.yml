name: CI regression

# Start after the build so testing cannot occupy its critical-path runners.
# Publication observes CI independently and never waits for this workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# workflow_run may not write build caches or obtain publication credentials.
cache-mode: read

concurrency:
  # An older build can complete after a newer one. It must not cancel the
  # newer source's tests; only duplicate tests of the same source may replace it.
  group: ci-regression-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  overlap:
    name: Check for same-SHA candidate verification
    if: >-
      github.event_name == 'workflow_run' && github.repository == 'ufna/zerus' && github.event.repository.private == false && vars.DEV_UPDATES_ENABLED == 'true' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'ufna/zerus' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    cache-mode: none
    permissions:
      contents: read
      actions: read
    outputs:
      run_checks: ${{ steps.candidate.outputs.run_checks }}
    steps:
      # workflow_run uses the trusted main workflow, never the triggering
      # run's code or an external PR's scripts with a token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Observe only exact main candidate verification
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/ci/regression-overlap.py
  checks:
    name: Main regression tests
    needs: overlap
    if: >-
      needs.overlap.outputs.run_checks == 'true' && github.event_name == 'workflow_run' && github.repository == 'ufna/zerus' && github.event.repository.private == false && vars.DEV_UPDATES_ENABLED == 'true' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'ufna/zerus' &&
      github.event.workflow_run.conclusion != 'cancelled'
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      run_linux: true
      run_arch: true
      run_macos: true
      run_windows: false
      run_ios: false
      save_caches: false
