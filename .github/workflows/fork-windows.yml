name: Fork Windows build

# WhiteWh/zerus only; not part of upstream Zerus. Builds and tests the Windows
# portable zip of whitewh/main, then publishes it with its update feed as a
# release of this fork. The fork's desktop updater installs those releases
# (docs/fork-updates.md). A pushed tag whitewh-exp-* builds that commit the same
# way and publishes an experimental prerelease: never the latest release, no
# feed, and no updater in its desktop app.
on:
  push:
    branches: [whitewh/main]
    tags: ['whitewh-exp-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-windows
  cancel-in-progress: false

jobs:
  windows:
    name: Windows portable zip and release
    if: github.repository == 'WhiteWh/zerus'
    runs-on: windows-2025
    timeout-minutes: 150
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      ZERUS_BUILD_JOBS: 4
      EXPERIMENTAL: ${{ startsWith(github.ref, 'refs/tags/whitewh-exp-') }}
      # Embedded in hgs-tray (the Tauri app since task #63): the build the updater
      # compares and the feed it reads.
      # Empty for an experimental build, so it neither updates nor gets updated.
      ZERUS_FORK_BUILD: ${{ !startsWith(github.ref, 'refs/tags/whitewh-exp-') && github.run_number || '' }}
      ZERUS_FORK_FEED_URL: ${{ !startsWith(github.ref, 'refs/tags/whitewh-exp-') && 'https://github.com/WhiteWh/zerus/releases/latest/download/zerus-fork-feed.json' || '' }}
    steps:
      - name: Check out text files unchanged
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Rust cache identity
        id: rust
        run: echo "rustc=$(rustc -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            services/mobile/connector/target
            services/mobile/relay/target
          key: fork-windows-cli-${{ steps.rust.outputs.rustc }}-${{ hashFiles('Cargo.lock', 'crates/lore-bin/Cargo.lock', 'services/mobile/connector/Cargo.lock', 'services/mobile/relay/Cargo.lock') }}
          restore-keys: fork-windows-cli-${{ steps.rust.outputs.rustc }}-
      # The runner gives every step a synchronous pipe as stdin; hgs must not inherit it.
      - name: Rust tests and release build
        run: |
          mkdir -p artifacts/test-results
          cargo test --locked --features socraticode </dev/null 2>&1 | tee artifacts/test-results/rust.log
          cargo build --release --locked --features socraticode
          # Task 182: lore runs as hgs's subprocess; its own Cargo.lock stays.
          cargo build --release --locked --manifest-path crates/lore-bin/Cargo.toml --target-dir target/lore
          # WhiteWh fork: the mobile gateway's connector and relay (docs/fork-updates.md).
          cargo test --locked --lib --manifest-path services/mobile/connector/Cargo.toml </dev/null 2>&1 | tee artifacts/test-results/connector.log
          cargo build --release --locked --manifest-path services/mobile/connector/Cargo.toml
          cargo build --release --locked --manifest-path services/mobile/relay/Cargo.toml
      - name: Save Rust cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            services/mobile/connector/target
            services/mobile/relay/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Pinned ConPTY pair
        run: python scripts/fetch-conpty.py --output "$RUNNER_TEMP/conpty" </dev/null
      # WhiteWh fork, task #388 (owner, 2026-11-08): only the Tauri desktop is
      # supported; the fork builds, tests and ships no Qt.
      # WhiteWh fork, task #63 (owner, 2026-11-06): the fork's Windows build runs
      # on the Tauri desktop, as upstream's Windows zip does. The installed Qt
      # build's updater installs this zip (its hgs-tray.exe is the Tauri app),
      # and the Tauri app updates itself from the same feed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the locked Zerus Next frontend
        timeout-minutes: 5
        working-directory: client
        run: npm ci </dev/null
      - name: Fork update channel and the Qt-to-Tauri handoff
        # The handoff runs the Qt updater's helper and the Tauri updater on a
        # versioned root: Qt build -> Tauri zip -> next Tauri zip, and both
        # rollbacks (client/core/tests/fork_handoff.rs).
        run: |
          cargo test --locked --manifest-path client/core/Cargo.toml --lib fork_update </dev/null 2>&1 | tee artifacts/test-results/fork-update.log
          cargo test --locked --manifest-path client/core/Cargo.toml --test fork_handoff </dev/null 2>&1 | tee artifacts/test-results/fork-handoff.log
      - name: Build the Tauri Windows desktop with the fork channel
        timeout-minutes: 30
        working-directory: client
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/windows-next
          CARGO_BUILD_JOBS: 4
        # ZERUS_FORK_BUILD and ZERUS_FORK_FEED_URL (job env) are embedded by
        # client/src-tauri/build.rs, as the Qt build embedded them.
        run: |
          npm run tauri -- build --ci --no-bundle --config src-tauri/tauri.windows.switch.conf.json --features video </dev/null \
            2>&1 | tee ../artifacts/test-results/windows-next-build.log
          test -f ../target/windows-next/release/hgs-tray.exe
      - name: Frontend runtime license notices
        run: python client/scripts/collect-notices.py artifacts/windows-frontend-licenses </dev/null
      - name: WebView2 Evergreen prerequisite for the portable self-test
        timeout-minutes: 6
        run: python scripts/ci/ensure-webview2.py </dev/null
      - name: Portable zip from the tested executables
        run: |
          # WhiteWh fork, task #65: the fork identity (ZERUS_FORK_BUILD and
          # ZERUS_FORK_FEED_URL from the job env); no Qt fallback (task #388).
          python scripts/package-windows.py --fork --cli target/release/hgs.exe --lore target/lore/release/lore.exe \
            --gui target/windows-next/release/hgs-tray.exe \
            --connector services/mobile/connector/target/release/zerus-mobile-connector.exe \
            --mobile-relay services/mobile/relay/target/release/zerus-relay.exe \
            --frontend-licenses artifacts/windows-frontend-licenses \
            --conpty "$RUNNER_TEMP/conpty" --output artifacts/zerus-windows-x86_64.zip </dev/null 2>&1 | tee artifacts/test-results/package.log
          python scripts/check-windows-portable.py artifacts/zerus-windows-x86_64.zip --run --selftest \
            </dev/null 2>&1 | tee artifacts/test-results/portable.log
      # Schema 1 of docs/fork-updates.md: the updater installs `url` only when its
      # size and SHA-256 match and the zip's build-info.json names `commit`.
      - name: Update feed
        if: env.EXPERIMENTAL != 'true'
        env:
          BUILD: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          python - <<'EOF'
          import hashlib, json, os, pathlib
          zip = pathlib.Path("artifacts/zerus-windows-x86_64.zip")
          build = int(os.environ["BUILD"])
          feed = {"schema": 1, "build": build, "commit": os.environ["COMMIT"],
                  "url": f"https://github.com/WhiteWh/zerus/releases/download/whitewh-{build}/{zip.name}",
                  "size": zip.stat().st_size, "sha256": hashlib.sha256(zip.read_bytes()).hexdigest()}
          pathlib.Path("artifacts/zerus-fork-feed.json").write_text(json.dumps(feed, indent=2) + "\n")
          print(json.dumps(feed, indent=2))
          EOF
      - name: Publish the fork release
        if: env.EXPERIMENTAL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
        run: |
          gh release create "whitewh-$BUILD" artifacts/zerus-windows-x86_64.zip artifacts/zerus-fork-feed.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Zerus fork build $BUILD" \
            --notes "Windows portable build $BUILD of whitewh/main at $GITHUB_SHA. Installed automatically by fork builds of Zerus (docs/fork-updates.md)."
      - name: Publish the experimental prerelease
        if: env.EXPERIMENTAL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/zerus-windows-x86_64.zip             --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false             --title "Zerus fork experimental $TAG"             --notes "Experimental Windows portable build of $GITHUB_SHA (tag $TAG). Not the latest release and not offered by the fork updater; this build does not update itself. Install it by hand (docs/fork-updates.md)."
      - name: Retain test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-windows-${{ github.run_number }}
          path: artifacts/test-results
          retention-days: 7

