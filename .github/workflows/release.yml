name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version matching VERSION (without v)
        required: true
        type: string
      create_draft:
        description: Create a GitHub draft release after all checks pass
        type: boolean
        default: false
      run_macos:
        description: Full stable qualification requires macOS checks (must remain true)
        type: boolean
        default: true
      macos_cask:
        description: Build, sign and notarize the Homebrew cask once MACOS_CASKS_ENABLED is set (needs macOS checks)
        type: boolean
        default: true

permissions:
  contents: read

cache-mode: none

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check requested release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          MACOS_CASK: ${{ inputs.macos_cask && vars.MACOS_CASKS_ENABLED == 'true' }}
          RUN_MACOS: ${{ inputs.run_macos }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ['REQUESTED_VERSION']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Use a stable semantic version.'
          assert version == pathlib.Path('VERSION').read_text().strip(), 'Update VERSION first.'
          assert os.environ['RUN_MACOS'] == 'true', 'Stable candidates require full macOS qualification.'
          PY
  source:
    name: Stable source recipe
    needs: version
    cache-mode: none
    uses: ./.github/workflows/release-source.yml
    with:
      version: ${{ inputs.version }}
  verify:
    needs: version
    cache-mode: read
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.sha }}
      run_linux: true
      run_arch: true
      arch_check_in_source: true
      run_macos: true
      # Stable releases carry the tested portable zip, as nightlies do.
      run_windows: true
      run_ios: true
  macos-unsigned:
    # Only this credential-free build overlaps verification. Signing still
    # waits for the complete matrix and this exact run's checked bundle.
    if: inputs.macos_cask && vars.MACOS_CASKS_ENABLED == 'true'
    needs: version
    uses: ./.github/workflows/macos-bundle.yml
    with:
      channel: stable
      run_tests: false
      tests_in_verify: true
  macos:
    # Homebrew casks start once the macos-signing environment is provisioned; see
    # docs/macos-distribution.md. macos_cask=false skips the cask for one release.
    if: >-
      !cancelled() && needs.verify.result == 'success' && needs.macos-unsigned.result == 'success' &&
      inputs.macos_cask && vars.MACOS_CASKS_ENABLED == 'true'
    needs: [verify, macos-unsigned]
    uses: ./.github/workflows/macos-cask.yml
    with:
      channel: stable
      reuse_unsigned: true
      unsigned_release: ${{ needs.macos-unsigned.outputs.release }}
      verify_installation: false
    secrets:
      MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
      MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
      APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
      APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
  cask-install:
    needs: macos
    if: ${{ !cancelled() && needs.macos.result == 'success' }}
    uses: ./.github/workflows/macos-cask-install.yml
    with:
      channel: stable
  assemble:
    needs: [verify, source, macos]
    # A skipped cask is acceptable only when it was not wanted for this release.
    if: >-
      !cancelled() && needs.verify.result == 'success' && needs.source.result == 'success' &&
      (needs.macos.result == 'success' || (needs.macos.result == 'skipped' && !(inputs.macos_cask && vars.MACOS_CASKS_ENABLED == 'true')))
    uses: ./.github/workflows/release-assemble.yml
    with:
      version: ${{ inputs.version }}
      macos: ${{ needs.macos.result == 'success' }}
  seal:
    needs: [assemble, cask-install]
    if: >-
      !cancelled() && needs.assemble.result == 'success' &&
      (needs.cask-install.result == 'success' || (needs.cask-install.result == 'skipped' && !(inputs.macos_cask && vars.MACOS_CASKS_ENABLED == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assembled-${{ github.sha }}
          path: dist
      - name: Seal only after assembly and the selected cask installation pass
        run: python3 scripts/seal-release.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zerus-${{ inputs.version }}-candidate
          path: dist
          retention-days: 14
          include-hidden-files: true
  draft:
    # An explicit status check keeps a skipped optional cask from skipping the draft.
    if: >-
      !cancelled() && needs.seal.result == 'success' && inputs.create_draft
    needs: seal
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zerus-${{ inputs.version }}-candidate
          path: dist
      - name: Create reviewed draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          gh release create "v$RELEASE_VERSION" --draft --target "$RELEASE_COMMIT" \
            --title "Zerus $RELEASE_VERSION" \
            --notes "Release candidate. Verify the artifacts and publication checklist before publishing." \
            dist/*.tar.gz dist/*.pkg.tar.zst dist/*.zip dist/SHA256SUMS dist/release-info.json
