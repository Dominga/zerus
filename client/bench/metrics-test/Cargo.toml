# Tests client/src-tauri/src/metrics.rs on its own, without building Tauri:
#   cargo +1.99.1 test --manifest-path client/bench/metrics-test/Cargo.toml
[package]
name = "zerus-client-metrics-test"
version = "0.0.0"
edition = "2021"
rust-version = "1.99"
publish = false

[lib]
path = "lib.rs"

[dependencies]
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[workspace]
