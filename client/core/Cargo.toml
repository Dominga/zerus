[package]
name = "zerus-client-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Watch streams, catalog state and per-frame batches of the Zerus desktop client"
publish = false

# Pure Rust and fast to test: no Tauri, no async runtime. The Tauri app in
# client/src-tauri depends on this crate by path.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zerus-watch-protocol = { path = "../../crates/watch-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Konsole tabs and raising over the session D-Bus (libdbus); the Linux app
# turns it on, while the crate's own checks build without it.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[features]
konsole = ["dep:dbus"]
