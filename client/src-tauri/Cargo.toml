[package]
name = "zerus-client"
version = "0.1.0"
description = "Zerus Next: the Tauri desktop client"
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false

# Its own package and lock, like crates/watch-protocol; the root hgs package
# depends on neither this crate nor client/core.

[lib]
# Distinct from the binary name, so Windows debug symbols of both never collide.
name = "zerus_client_lib"

[features]
default = ["live"]
# Streams from `hgs watch` through zerus-client-core. Without it the app builds
# with no data source and the frontend uses its built-in replay.
live = ["dep:zerus-client-core"]
# Voice messages: microphone capture through client/media (cpal). Linux
# builds need the ALSA development package; nothing else does.
media = ["live", "dep:zerus-client-media"]
# Round video messages on Linux through GStreamer (its development package
# to build; an H.264 and an AAC encoder plugin at run time).
video = ["media", "zerus-client-media/video"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The clipboard is written from Rust only (copy_text): the webview loses the user activation navigator.clipboard needs while hgs runs.
tauri-plugin-clipboard-manager = "2"
zerus-watch-protocol = { path = "../../crates/watch-protocol" }
uuid = { version = "1", features = ["v4"] }
# The pure-Rust core (watch streams, catalog state, per-frame batches).
zerus-client-core = { path = "../core", optional = true }
zerus-client-media = { path = "../media", optional = true }

# Linux: the refresh rate of the window's monitor (display.rs); the same gtk as tauri's.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# macOS: process metrics through libproc, and the WebKit preference that lets
# page rendering follow the display rate (platform/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = { version = "0.6.4", features = ["exception"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSProcessInfo"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKPreferences", "WKWebViewConfiguration"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Dependencies optimised once keep the debug app responsive.
[profile.dev.package."*"]
opt-level = 2
