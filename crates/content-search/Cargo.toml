[package]
name = "zerus-content-search"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Bounded, disposable public-message search index"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
regex = "1"
regex-syntax = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
