[package]
name = "zerus-desktop-catalog"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Bounded disk-backed watch catalog projection for the hgs desktop actor"
publish = false

[dependencies]
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
zerus-watch-protocol = { path = "../watch-protocol" }

[dev-dependencies]
tempfile = "3"
