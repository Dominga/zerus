[package]
name = "zerus-desktop-ledger"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Durable identity and receipt guards owned by the hgs desktop writer actor"
publish = false

[dependencies]
zerus-desktop-read-policy = { path = "../desktop-read-policy" }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = "1"

[dev-dependencies]
tempfile = "3"
