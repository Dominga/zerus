[package]
name = "zerus-desktop-migration"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Shared structural contract for read-only desktop import evidence and writer handoff"
publish = false

# No GUI, database, runtime, effects or ownership proof. The importer and
# hgs desktop compose these types with their existing readers and OS locks.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
