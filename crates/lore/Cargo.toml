[package]
name = "zerus-lore"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "RustCodeLore: records, validation and the canonical JSONL store"
publish = false

[dependencies]
anyhow = "1"
fs2 = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "1.1"

[dev-dependencies]
tempfile = "3"
