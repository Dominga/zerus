[package]
name = "zerus-replica-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "The Zerus task replica for the mobile apps, through UniFFI"
publish = false

[lib]
name = "zerus_replica_ffi"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Only for generating the bindings: the apps' library never contains the generator.
bindgen = ["uniffi/cli"]

[dependencies]
base64 = "0.22"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
zerus-mobile-crypto = { path = "../../services/mobile/crypto" }
sha2 = "0.10"
zeroize = "1"
uniffi = "=0.32.2"
zerus-replica = { path = "../replica" }

[dev-dependencies]
zerus-replica = { path = "../replica", features = ["test-support"] }
zerus-mobile-endpoint = { path = "../../services/mobile/endpoint" }
zerus-mobile-task-edit = { path = "../mobile-task-edit" }
tempfile = "3"

[profile.release]
# The library ships once per ABI in the APK: small and without symbols.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
