[package]
name = "zerus-watch-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Frames and control operations of the hgs watch event stream (watch-v1)"
publish = false

# Shared by hgs and its clients. Keep it to serde: no Loro, Qt or async runtime.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
