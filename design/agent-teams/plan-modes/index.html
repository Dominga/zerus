<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan modes · U59 mock-up</title>
<style>
/* U59 plan modes. Everything up to the U59 block is the U36 page's (design/agent-teams/pipelines),
   which takes its tokens, buttons, chips, cards and the catalog editor from the Zerus UI
   prototype (Zerus-UI-handoff/Zerus-prototype.html); new here are the stage
   chip, the stage track, the stage editor and the rounds timeline. */
html,body{margin:0}
body{background:#0e1115;font:13px/1.45 "Segoe UI",system-ui,sans-serif;color:#e6e8eb}
body.lightpage{background:#e4e9ee;color:#1a2733}
.app{--bg:#14181d;--surface:#1b1f26;--card:#181c22;--cardBorder:#232932;--cardHover:#1e232b;--cardSel:#1b2621;--cardSelBorder:#2f5a4a;--field:#11151a;--border:#2c323b;--segOn:#26443a;--hover:#222830;--accent:#7dd3b0;--accentText:#0f1a16;--accentHover:#a8e6cc;--accentMuted:#5c9e86;--warn:#e8a75a;--danger:#ef7d6d;--folder:#7fb6e0;--violet:#b79cff;--fg:#e6e8eb;--text2:#c4cad1;--text3:#aab1ba;--muted:#9aa3ad;--label:#8f97a2;--dim:#7b8590;--tile:#0f1318;--warnBg:rgba(232,167,90,.11);--dangerBg:rgba(239,125,109,.11);--accentBg:rgba(125,211,176,.10);--page:#0e1115;--shadow:0 12px 40px rgba(0,0,0,.45);--r-lead:#b79cff;--r-backend:#6fa8ff;--r-frontend:#f08bb4;--r-tester:#56c8e0;--r-reviewer:#d9b38c;--r-secretary:#7fcf9a;--r-researcher:#b9d36b;
  --s-review:#b79cff;--s-test:#7fb6e0;--s-accept:#7dd3b0;
  position:relative;display:flex;flex-direction:column;background:var(--page);color:var(--fg);font:12px/1.38 "Segoe UI",-apple-system,system-ui,sans-serif;overflow:hidden;color-scheme:dark}
.app.light{--bg:#f5f7f9;--surface:#ffffff;--card:#ffffff;--cardBorder:#e1e6eb;--cardHover:#eef2f5;--cardSel:#e7f3ee;--cardSelBorder:#9fd3bd;--field:#ffffff;--border:#d6dde4;--segOn:#e0f0e9;--hover:#edf1f4;--accent:#167357;--accentText:#ffffff;--accentHover:#115d46;--accentMuted:#4f8f78;--warn:#9a5a0c;--danger:#c4402f;--folder:#2f6ea3;--violet:#6f4fd8;--fg:#1a2733;--text2:#2c3a47;--text3:#415060;--muted:#5d6b7c;--label:#647181;--dim:#6f7b88;--tile:#eef2f5;--warnBg:rgba(168,98,15,.09);--dangerBg:rgba(196,64,47,.08);--accentBg:rgba(22,115,87,.08);--page:#e4e9ee;--shadow:0 12px 36px rgba(20,30,40,.18);--r-lead:#6f4fd8;--r-backend:#2f66c9;--r-frontend:#b83a72;--r-tester:#137f95;--r-reviewer:#8a5a2b;--r-secretary:#2f7d4a;--r-researcher:#5f7a12;
  --s-review:#6f4fd8;--s-test:#2f6ea3;--s-accept:#167357;color-scheme:light}
.app *{box-sizing:border-box}
.app button,.app input,.app select,.app textarea{font:inherit;color:inherit}
.mono{font-family:"Cascadia Mono",Consolas,ui-monospace,monospace}
.i{width:14px;height:14px;flex:none;vertical-align:middle;overflow:visible}
.i path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.i path.f{fill:currentColor;stroke:none}
.i path.k{stroke:var(--card);stroke-width:2.2}
.i.s10{width:10px;height:10px}.i.s12{width:12px;height:12px}.i.s16{width:16px;height:16px}
.lg{width:14px;height:14px;flex:none}
.lg path{stroke:none}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.dim{color:var(--dim)}.lbl{color:var(--label)}.warn{color:var(--warn)}.danger{color:var(--danger)}.acc{color:var(--accent)}.okc{color:var(--accentMuted)}
.row{display:flex;align-items:center;gap:6px;min-width:0}
.col{display:flex;flex-direction:column;gap:6px;min-width:0}
.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:26px;padding:3px 11px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text2);white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentText);font-weight:600}
.btn.dng{color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:23px;padding:2px 9px;font-size:11px}
.btn.icon{padding:0;width:26px}
.btn.sm.icon{width:23px}
.btn.dis{opacity:.42}
.field{min-width:0;white-space:nowrap;overflow:hidden;background:var(--field);border:1px solid var(--border);border-radius:7px;padding:4px 8px;min-height:27px;color:var(--fg);width:100%;display:flex;align-items:center;gap:6px}
.field.sel::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-2px) rotate(45deg);flex:none}
.field.focus{border-color:var(--cardSelBorder);box-shadow:0 0 0 3px var(--accentBg)}
.field.ta{white-space:normal;align-items:flex-start;min-height:46px;line-height:1.45}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);flex:none}
.seg span{color:var(--muted);padding:4px 10px;min-height:25px;display:inline-flex;align-items:center;gap:5px;font-size:11.5px}
.seg span+span{border-left:1px solid var(--border)}
.seg span.on{background:var(--segOn);color:var(--accent);font-weight:600}
.seg.sm span{padding:2px 8px;min-height:21px;font-size:11px}
.pill{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:6px;background:var(--hover);color:var(--text3);font-size:11px;white-space:nowrap;flex:none}
.pill.acc{background:var(--accentBg);color:var(--accent)}
.pill.warnp{background:var(--warnBg);color:var(--warn)}
.pill.dngp{background:var(--dangerBg);color:var(--danger)}
.pill.out{background:transparent;border:1px solid var(--border)}
.role{--rc:var(--muted);display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 7px 0 5px;border-radius:9px;font-size:11px;font-weight:600;color:var(--rc);border:1px solid color-mix(in srgb,var(--rc) 45%,transparent);background:color-mix(in srgb,var(--rc) 12%,transparent);white-space:nowrap;flex:none}
.role .i{width:11px;height:11px}
.role.mini{height:16px;padding:0 5px 0 4px;font-size:10px}
.rc-lead{--rc:var(--r-lead)}.rc-backend{--rc:var(--r-backend)}.rc-frontend{--rc:var(--r-frontend)}.rc-tester{--rc:var(--r-tester)}.rc-reviewer{--rc:var(--r-reviewer)}.rc-secretary{--rc:var(--r-secretary)}.rc-researcher{--rc:var(--r-researcher)}
.tile{width:22px;height:22px;border-radius:6px;background:var(--tile);border:1px solid var(--cardBorder);display:inline-grid;place-items:center;flex:none}
.tile .lg{width:13px;height:13px}
.tile.t16{width:17px;height:17px;border-radius:5px}.tile.t16 .lg{width:11px;height:11px}
.ih{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:6px}
.dmark{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:5px;font-size:9.5px;font-weight:700;letter-spacing:.3px;flex:none}
.dm-new{background:var(--accentBg);color:var(--accent);border:1px solid var(--cardSelBorder)}
.dm-changed{background:color-mix(in srgb,var(--folder) 14%,transparent);color:var(--folder);border:1px solid color-mix(in srgb,var(--folder) 45%,transparent)}
.dm-removed{background:var(--dangerBg);color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 45%,transparent)}
.old{text-decoration:line-through;color:var(--danger);background:var(--dangerBg);border-radius:3px;padding:0 4px;margin-right:4px}
.nw{background:var(--accentBg);color:var(--accent);border-radius:3px;padding:0 4px}
.app,.app *{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--text3) 28%,transparent) transparent}
.app ::-webkit-scrollbar{width:8px;height:8px}
.app ::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--text3) 24%,transparent);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.app ::-webkit-scrollbar-track,.app ::-webkit-scrollbar-corner{background:transparent}

/* ===== new: stage chip and track ===== */
.stg{--sc:var(--muted);display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px 0 5px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;flex:none;color:var(--sc);background:color-mix(in srgb,var(--sc) 13%,transparent)}
.stg .i{width:12px;height:12px}
.stg .r{font-weight:400;opacity:.85}
.sk-review{--sc:var(--s-review)}.sk-test{--sc:var(--s-test)}.sk-accept{--sc:var(--s-accept)}.sk-warn{--sc:var(--warn)}.sk-danger{--sc:var(--danger)}.sk-wait{--sc:var(--muted)}
.stg.out{background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sc) 50%,transparent)}
.stg.skip{text-decoration:line-through;opacity:.8}
.trk{display:inline-flex;gap:2px;align-items:center;flex:none}
.trk i{width:9px;height:4px;border-radius:2px;background:var(--border)}
.trk i.d{background:var(--accentMuted)}
.trk i.c{background:var(--sc,var(--accent))}
.trk i.x{background:transparent;box-shadow:inset 0 0 0 1px var(--dim)}
.hold{display:flex;align-items:center;gap:5px;color:var(--warn);font-size:11px;min-width:0}
.hold .i{width:12px;height:12px}

/* ===== workspace and board (U33 widths) ===== */
.twbar{flex:none;display:flex;align-items:center;gap:9px;min-height:40px;padding:4px 14px;border-bottom:1px solid var(--cardBorder);background:var(--bg)}
.twbar .tn{font-weight:600;font-size:14px}
.tbadge{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid currentColor;flex:none}
.tb-running{color:var(--accent)}.tb-draft{color:var(--folder);border-style:dashed}
.twbody{flex:1;min-height:0;display:flex}
.twmain{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.twtool{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px}
.bscroll{flex:1;min-height:0;overflow-x:auto;overflow-y:auto;padding:0 12px 10px}
.bpage{display:flex;flex-direction:column;gap:8px;width:max-content}
.phase{border:1px solid var(--cardBorder);border-radius:11px;background:var(--card)}
.phase.run{border-color:color-mix(in srgb,var(--accent) 45%,var(--cardBorder))}
.phase.draft{border-style:dashed;border-color:color-mix(in srgb,var(--folder) 55%,var(--cardBorder))}
.ph{display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;position:sticky;left:0;width:fit-content}
.ph .pn{width:18px;height:18px;border-radius:9px;background:var(--hover);display:grid;place-items:center;font-size:10.5px;color:var(--muted)}
.ph b{font-size:13px}
.pbar{display:flex;gap:2px;height:5px;width:120px}
.pbar i{flex:1;border-radius:2px;background:var(--border)}.pbar i.on{background:var(--accentMuted)}
.board7{display:grid;grid-template-columns:repeat(7,240px);gap:8px;padding:0 8px 8px;align-items:start}
.bcol{background:var(--bg);border:1px solid var(--cardBorder);border-radius:10px;padding:7px;display:flex;flex-direction:column;gap:6px;min-height:70px}
.bcol.prob{border-color:color-mix(in srgb,var(--danger) 55%,var(--cardBorder))}
.bcol.rev{border-color:color-mix(in srgb,var(--s-review) 40%,var(--cardBorder))}
.bcol.tst{border-color:color-mix(in srgb,var(--s-test) 40%,var(--cardBorder))}
.bh{display:flex;align-items:center;gap:5px;font-weight:600;color:var(--text3);padding:2px 4px;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase}
.bh .n{margin-left:auto}
.bh .q{font-weight:400;text-transform:none;letter-spacing:0;color:var(--dim)}
.bcard{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:7px 9px;display:flex;flex-direction:column;gap:5px;width:100%;position:relative}
.bcard.pw{border-color:var(--warn)}.bcard.pd{border-color:var(--danger)}.bcard.on{box-shadow:0 0 0 2px var(--accent)}
.bcard .l1{display:flex;align-items:flex-start;gap:6px;font-size:12px;min-width:0}
.bcard .l1 .id{font-weight:600;flex:none}
.bcard .l1 .dep{color:var(--folder);font-size:11px;flex:none;padding-top:1px}
.bcard .l1 .tt{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .l2{display:flex;align-items:center;gap:6px;min-width:0;font-size:11px}
.bcard .l3{display:flex;align-items:center;gap:5px;min-width:0;font-size:11px}
.bcard .l3 .who{display:inline-flex;align-items:center;gap:4px;color:var(--muted);min-width:0}
.bempty{color:var(--dim);border:1px dashed var(--border);border-radius:8px;text-align:center;padding:10px 6px;font-size:11px}
.feedbar{flex:none;height:34px;border-top:1px solid var(--cardBorder);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:11.5px;background:var(--bg)}
.side{width:400px;flex:none;border-left:1px solid var(--cardBorder);display:flex;flex-direction:column;min-height:0;background:var(--bg);padding:10px;gap:8px;overflow:hidden}
.sech{display:flex;align-items:center;gap:6px;min-height:26px}
.sech h3{margin:0;font-size:12.5px;font-weight:600}
.mcard{display:grid;grid-template-columns:22px 1fr auto;gap:4px 9px;padding:8px 9px;border-radius:10px;border:1px solid var(--cardBorder);background:var(--card)}
.mcard.probw{border-color:color-mix(in srgb,var(--warn) 60%,var(--cardBorder))}
.mcard .mr{display:flex;align-items:center;gap:6px;min-width:0}
.mcard .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11px;color:var(--dim)}
.sq{grid-column:2/4;display:flex;flex-direction:column;gap:3px;margin-top:2px;padding:5px 7px;border-radius:7px;background:var(--hover);font-size:11px}
.sq .sqh{display:flex;align-items:center;gap:5px;color:var(--label)}
.sq .sqr{display:flex;align-items:center;gap:6px;color:var(--text2);min-width:0}
.tip{position:absolute;z-index:5;width:300px;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);padding:8px 10px;font-size:11.5px;display:flex;flex-direction:column;gap:4px;color:var(--text2)}
.tip b{color:var(--fg)}

/* ===== catalog editor ===== */
.cat{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.cath{flex:none;display:flex;align-items:center;gap:9px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--cardBorder)}
.cath .tn{font-size:15px;font-weight:600}
.catbody{flex:1;overflow:hidden;padding:12px 16px 20px;display:flex;flex-direction:column;gap:12px}
.ctabs{display:flex;align-items:center;gap:10px}
.ctabs .seg span{font-size:12.5px;padding:5px 12px}
.ctabs .cnt{display:inline-grid;place-items:center;min-width:18px;height:17px;padding:0 5px;border-radius:9px;background:var(--hover);color:var(--text3);font-size:10.5px;font-weight:600}
.roles2{display:flex;gap:14px;align-items:flex-start;min-height:0}
.rlist{width:250px;flex:none;display:flex;flex-direction:column;gap:3px}
.pitem{padding:7px 10px;border-radius:9px;border:1px solid transparent;display:flex;flex-direction:column;gap:2px}
.pitem.on{background:var(--cardSel);border-color:var(--cardSelBorder)}
.pitem .pn{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px}
.pitem .ps{font-size:11px;color:var(--muted)}
.pitem .flow{display:flex;align-items:center;gap:3px;margin-top:3px;flex-wrap:wrap}
.redit{flex:1;min-width:0;border:1px solid var(--cardBorder);border-radius:11px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:11px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:9px 14px;align-items:center}
.kv>.k{color:var(--label);text-align:right;font-size:12px}
.kv>.k.top{align-self:start;padding-top:5px}
.note{font-size:11px;color:var(--dim);line-height:1.45}
.stab{display:grid;grid-template-columns:16px 22px 132px 1fr 210px 92px 24px;gap:8px;align-items:center}
.stab .th{font-size:11px;color:var(--label)}
.stab .fixed{opacity:.7}
.grip{color:var(--dim)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:7px;overflow:hidden;height:26px}
.stepper span{width:24px;text-align:center;color:var(--muted)}
.stepper b{min-width:24px;text-align:center;font-weight:600;border-left:1px solid var(--border);border-right:1px solid var(--border);line-height:24px}
.sdetail{grid-column:3/7;border:1px solid var(--cardBorder);border-radius:9px;background:var(--bg);padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.opt{display:grid;grid-template-columns:16px 1fr;gap:3px 7px;align-items:start}
.radio{width:13px;height:13px;border-radius:7px;border:1.5px solid var(--border);margin-top:2px}
.radio.on{border-color:var(--accent);box-shadow:inset 0 0 0 2.5px var(--card),inset 0 0 0 7px var(--accent)}
.cbx{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--border);flex:none;display:inline-grid;place-items:center}
.cbx.on{background:var(--accent);border-color:var(--accent)}
.cbx.on::after{content:"";width:6px;height:3px;border-left:1.6px solid var(--accentText);border-bottom:1.6px solid var(--accentText);transform:translateY(-1px) rotate(-45deg)}
.dtab{width:100%;border-collapse:collapse;font-size:12px}
.dtab td,.dtab th{padding:5px 8px;border-bottom:1px solid var(--cardBorder);text-align:left}
.dtab th{color:var(--label);font-weight:400;font-size:11px}
.try{border:1px dashed var(--border);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:9px;background:var(--bg)}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:22px 1fr;gap:2px 9px;position:relative;padding-bottom:9px}
.step:not(:last-child)::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:1.5px;background:var(--border)}
.step .dot{width:22px;height:22px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--sc,var(--muted)) 15%,transparent);color:var(--sc,var(--muted))}
.step .dot .i{width:12px;height:12px}
.step .sh{display:flex;align-items:center;gap:6px;min-height:22px;font-weight:600;flex-wrap:wrap}
.step .sb{grid-column:2;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.prop{border:1px solid var(--cardBorder);border-radius:10px;background:var(--card);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.prop.kept{border-color:var(--cardSelBorder)}.prop.rej{opacity:.55}.prop.rej .pt{text-decoration:line-through}
.plate{border:1px dashed color-mix(in srgb,var(--folder) 55%,var(--cardBorder));border-radius:9px;padding:7px 10px;display:flex;flex-direction:column;gap:3px;background:color-mix(in srgb,var(--folder) 5%,transparent)}
.dchat{width:470px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--cardBorder);min-height:0;background:var(--bg)}
.dhd{flex:none;padding:10px 14px;border-bottom:1px solid var(--cardBorder);display:flex;flex-direction:column;gap:7px}
.dfeed{flex:1;overflow:hidden;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.bubble{align-self:flex-end;max-width:88%;background:var(--segOn);border:1px solid var(--cardSelBorder);border-radius:12px 12px 4px 12px;padding:8px 11px;color:var(--fg);line-height:1.45}
.tool{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;padding-left:4px;border-left:2px solid var(--border)}
.tool b{color:var(--text2);font-weight:600}

/* ===== inspector and plan ===== */
.insp{background:var(--bg);display:flex;flex-direction:column;min-height:0;border:1px solid var(--cardBorder)}
.ihd{padding:12px 14px 10px;border-bottom:1px solid var(--cardBorder);display:flex;flex-direction:column;gap:7px}
.ibody{flex:1;overflow:hidden;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.ifoot{flex:none;border-top:1px solid var(--cardBorder);padding:9px 12px;display:flex;gap:6px;align-items:center;background:var(--bg)}
.box{border:1px solid var(--cardBorder);border-radius:10px;background:var(--card);padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.kv2{display:grid;grid-template-columns:86px 1fr;gap:5px 10px;font-size:11.5px;align-items:baseline}
.kv2 .k{color:var(--label)}
.kv2 .v{color:var(--text2);min-width:0}
.pipe{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pipe .arr{color:var(--dim);font-size:11px}
.rnd{display:grid;grid-template-columns:22px 1fr;gap:3px 8px;position:relative;padding-bottom:10px}
.rnd:not(:last-child)::before{content:"";position:absolute;left:10px;top:23px;bottom:1px;width:1.5px;background:var(--border)}
.rnd .dot{width:22px;height:22px;border-radius:11px;display:grid;place-items:center;color:var(--sc,var(--muted));background:color-mix(in srgb,var(--sc,var(--muted)) 15%,transparent)}
.rnd .dot .i{width:12px;height:12px}
.rnd .rh{display:flex;align-items:center;gap:6px;min-height:22px;flex-wrap:wrap}
.rnd .rh b{font-size:12px}
.rnd .rb{grid-column:2;display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
.verdict{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 7px;border-radius:9px;font-size:10.5px;font-weight:700;letter-spacing:.2px}
.v-pass{background:var(--accentBg);color:var(--accent)}
.v-return{background:var(--warnBg);color:var(--warn)}
.v-run{background:color-mix(in srgb,var(--s-test) 14%,transparent);color:var(--s-test)}
.v-wait{background:var(--hover);color:var(--muted)}
.find{display:grid;grid-template-columns:auto 1fr;gap:2px 7px;padding:5px 8px;border:1px solid var(--cardBorder);border-radius:7px;background:var(--card);color:var(--text2);font-size:11.5px}
.sev{font-size:9.5px;font-weight:700;letter-spacing:.3px;padding:0 5px;border-radius:4px;height:16px;display:inline-flex;align-items:center;text-transform:uppercase}
.sev-major{background:var(--dangerBg);color:var(--danger)}.sev-minor{background:var(--warnBg);color:var(--warn)}.sev-nit{background:var(--hover);color:var(--muted)}
.find .loc{grid-column:2;color:var(--dim);font-size:11px}
.find.fixed{opacity:.65}
.menu{position:absolute;z-index:6;min-width:250px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;box-shadow:var(--shadow)}
.menu .mi{display:grid;grid-template-columns:16px 1fr;gap:1px 9px;align-items:center;padding:6px 9px;border-radius:6px;color:var(--text2)}
.menu .mi.on{background:var(--hover);color:var(--fg)}
.menu .mi .md{grid-column:2;font-size:11px;color:var(--dim)}
.menu .msep{height:1px;background:var(--cardBorder);margin:4px 2px}
.menu .mh{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;font-weight:600;padding:6px 9px 3px}
.frow{display:grid;grid-template-columns:38px 16px 1fr;gap:6px;align-items:start;padding:5px 2px;border-bottom:1px solid var(--cardBorder);font-size:11.5px}
.frow .ft{color:var(--dim);font-size:10.5px;padding-top:1px}
.frow .fx{color:var(--text2)}

/* ===== gallery chrome (not part of the design) ===== */
.gal{max-width:2300px;margin:0 auto;padding:24px 28px 60px}
.gal header{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.gal h1{font-size:20px;margin:0}
.gal .lead{max-width:980px;opacity:.8;margin:4px 0 18px}
.gal .tgl{display:inline-flex;border:1px solid #445;border-radius:8px;overflow:hidden}
.gal .tgl a{padding:4px 12px;color:inherit;text-decoration:none;font-size:12px}
.gal .tgl a.on{background:#2a4a3e;color:#bdf0da}
.lightpage .gal .tgl a.on{background:#cfe8dc;color:#115d46}
.gal nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.gal nav a{font-size:12px;color:inherit;opacity:.85;border:1px solid #445;border-radius:12px;padding:2px 10px;text-decoration:none}
.gal section{margin:0 0 40px}
.gal h2{font-size:15px;margin:0 0 4px}
.gal .cap{max-width:1100px;opacity:.8;margin:0 0 10px;font-size:12.5px}
.gal .frame{box-shadow:0 0 0 1px rgba(128,140,155,.35);border-radius:6px;overflow:hidden;width:max-content;max-width:100%;overflow-x:auto}
body.shot{overflow:hidden}

/* ===== U59: plan modes ===== */
.app{--free:#9db4ff;--freeText:#10162b;--scrim:rgba(5,8,12,.58)}
.app.light{--free:#3f5bc4;--freeText:#ffffff;--scrim:rgba(30,42,54,.30)}
.mode{--mc:var(--muted);display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px 0 5px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;flex:none;color:var(--mc);border:1px solid color-mix(in srgb,var(--mc) 42%,transparent)}
.mode .i{width:12px;height:12px}
.mode .r{font-weight:400;opacity:.85}
.mode.std{background:transparent;font-weight:500}
.mode.free{--mc:var(--free);background:color-mix(in srgb,var(--free) 13%,transparent)}
.pill.freep{background:color-mix(in srgb,var(--free) 13%,transparent);color:var(--free)}
.twbar{gap:10px}
.hphase{display:inline-flex;align-items:center;gap:6px;padding-left:4px}
.hstat{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding-left:8px;border-left:1px solid var(--cardBorder)}
.tb-open{color:var(--free)}
.tb-idle{color:var(--muted)}
.phase.free{border-color:color-mix(in srgb,var(--free) 50%,var(--cardBorder))}
.phase.free.idle{border-style:dashed}
.psub{display:flex;align-items:center;gap:7px;padding:0 14px 8px 40px;font-size:11.5px}
.gph{position:relative;margin:0 8px 8px;border-radius:9px}
.gedges{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gedges path{fill:none;stroke:var(--dim);stroke-width:1.3;opacity:.7}
.gnode{position:absolute;width:232px;height:60px;border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:7px 9px 6px 12px;display:flex;flex-direction:column;gap:6px;overflow:hidden;font-size:12px}
.gnode::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--nb)}
.gnode .dep{color:var(--folder);font-size:11px;flex:none}
.mcard2{border:1px solid color-mix(in srgb,var(--free) 40%,var(--cardBorder));border-radius:11px;background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:10px;max-width:980px}
.proposal{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-radius:8px;background:color-mix(in srgb,var(--r-lead) 10%,transparent);border:1px solid color-mix(in srgb,var(--r-lead) 30%,transparent);color:var(--text2);line-height:1.45}
.proposal .i{margin-top:2px;color:var(--r-lead)}
.mopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mopt{border:1px solid var(--cardBorder);border-radius:10px;padding:10px 12px;background:var(--bg);display:grid;grid-template-columns:16px 1fr;gap:4px 9px;line-height:1.45}
.mopt.on{border-color:color-mix(in srgb,var(--free) 60%,var(--cardBorder));background:color-mix(in srgb,var(--free) 6%,var(--card))}
.mopt b{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.mopt .radio.on{border-color:var(--free);box-shadow:inset 0 0 0 2.5px var(--card),inset 0 0 0 7px var(--free)}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:8}
.dlg{position:absolute;left:50%;transform:translateX(-50%);z-index:9;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:12px;line-height:1.45}
.mtile{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;color:var(--free);background:color-mix(in srgb,var(--free) 13%,transparent)}
.chg{display:grid;grid-template-columns:16px 1fr;gap:8px;align-items:start;color:var(--text2)}
.chg .i{margin-top:2px;color:var(--free)}
.idlebox{display:flex;gap:12px;align-items:flex-start;margin:0 14px 14px 40px;padding:14px 16px;border:1px dashed color-mix(in srgb,var(--free) 45%,var(--border));border-radius:10px;max-width:720px}
.frame2{border:1px solid var(--cardBorder);border-radius:9px;overflow:hidden}
.strip{display:flex;align-items:center;gap:7px;width:380px;padding:6px 10px;border:1px solid var(--cardBorder);border-radius:9px;background:var(--card);margin-bottom:6px;font-size:11.5px}
.code{padding:8px 10px;border:1px solid var(--cardBorder);border-radius:8px;background:var(--field);font-size:11.5px;color:var(--text2);line-height:1.6}
.code b{color:var(--free)}
.twbar .tn,.hphase,.hstat,.twbar .btn{white-space:nowrap;flex:none}
</style>

/* ---------------------------------------------------------------- render */
const params = new URLSearchParams(location.search);
const theme = params.get('theme') || 'dark';
const one = params.get('view');
const root = document.getElementById('root');
const frame = (k) => `<div class="app ${theme === 'light' ? 'light' : ''}" style="width:${V[k].w}px;height:${V[k].h}px">${V[k].html()}</div>`;
if (one && V[one]) {
  document.body.classList.add('shot');
  if (theme === 'light') document.body.classList.add('lightpage');
  root.innerHTML = frame(one);
} else {
  if (theme === 'light') document.body.classList.add('lightpage');
  const other = theme === 'light' ? 'dark' : 'light';
  root.innerHTML = `<div class="gal"><header><h1>U59 · Plan modes — mock-up</h1>
    <span class="tgl"><a href="?theme=dark" class="${theme === 'dark' ? 'on' : ''}">Dark</a><a href="?theme=light" class="${theme === 'light' ? 'on' : ''}">Light</a></span></header>
    <p class="lead">Free planning beside the standard mode: the lead proposes a mode when planning starts and the owner chooses; switching a running team to free needs the owner’s confirmation of that request; a free phase takes tasks as they come, is idle (not done) when they are accepted, builds when asked and closes only when the owner closes it. Every view has a PNG beside this file in both themes (<code>shots/&lt;view&gt;-dark.png</code>, <code>-light.png</code>). Sample data: the Orbit team from the UI prototype, after its 2.4 release.</p>
    <nav>${Object.keys(V).map(k => `<a href="#${k}">${V[k].title}</a>`).join('')}</nav>
    ${Object.keys(V).map(k => `<section id="${k}"><h2>${V[k].title}</h2><p class="cap">${V[k].cap}</p><div class="frame">${frame(k)}</div></section>`).join('')}</div>`;
}
