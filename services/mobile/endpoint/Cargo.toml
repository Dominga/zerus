[package]
name = "zerus-mobile-endpoint"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Shared private mobile endpoint authorization and custody"

[dependencies]
zerus-mobile-crypto = { path = "../crypto" }
zerus-file-lock = { path = "../../../crates/file-lock" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
sha2 = "0.10"
ring = { version = "0.17", default-features = false }
uuid = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
[target.'cfg(windows)'.dependencies]
zerus-windows-private = { path = "../windows-private" }
[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"
